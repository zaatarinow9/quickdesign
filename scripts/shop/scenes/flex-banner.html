<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:T;font-weight:700;src:url(../fonts/thmanyahsans-Bold.woff2)}
@font-face{font-family:T;font-weight:500;src:url(../fonts/thmanyahsans-Medium.woff2)}
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
.scene{position:relative;width:1200px;height:1200px;background:
 radial-gradient(1200px 700px at 30% 10%,#dfe9f3 0%,#c9d9e8 45%,#b9cbdc 100%)}
/* Hintergrund: unscharfe Bäume/Gebäude */
.bg{position:absolute;inset:0;filter:blur(18px);opacity:.75}
.bg i{position:absolute;border-radius:50%;background:#7e9a74}
.ground{position:absolute;left:0;right:0;bottom:0;height:360px;background:linear-gradient(#a9a397,#8f897d)}
.ground:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 160px)}
/* Bauzaun */
.fence{position:absolute;left:-20px;right:-20px;top:330px;height:620px}
.post{position:absolute;top:0;bottom:0;width:22px;background:linear-gradient(90deg,#8d9196,#e7e9ec 35%,#a6aaaf 60%,#6f7378);border-radius:4px;box-shadow:6px 8px 14px rgba(0,0,0,.25)}
.rail{position:absolute;left:0;right:0;height:14px;background:linear-gradient(#e3e5e8,#9a9ea3);box-shadow:0 6px 10px rgba(0,0,0,.18)}
.mesh{position:absolute;left:0;right:0;top:20px;bottom:20px;background:
 repeating-linear-gradient(90deg,rgba(90,94,99,.55) 0 3px,transparent 3px 46px),
 repeating-linear-gradient(0deg,rgba(90,94,99,.55) 0 3px,transparent 3px 46px)}
/* Banner */
.banner{position:absolute;left:110px;top:430px;width:980px;height:330px;background:#fff;
 box-shadow:0 30px 40px -18px rgba(0,0,0,.45),0 3px 6px rgba(0,0,0,.2);overflow:hidden}
.banner:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:
 linear-gradient(100deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.35) 32%,rgba(255,255,255,0) 44%),
 linear-gradient(90deg,rgba(0,0,0,.07),rgba(0,0,0,0) 8%,rgba(0,0,0,0) 92%,rgba(0,0,0,.08)),
 radial-gradient(160px 60px at 12% 6%,rgba(0,0,0,.10),transparent 70%),
 radial-gradient(160px 60px at 88% 6%,rgba(0,0,0,.10),transparent 70%),
 radial-gradient(160px 60px at 12% 94%,rgba(0,0,0,.10),transparent 70%),
 radial-gradient(160px 60px at 88% 94%,rgba(0,0,0,.10),transparent 70%),
 radial-gradient(120px 40px at 50% 4%,rgba(0,0,0,.08),transparent 70%)}
.hem{position:absolute;left:0;right:0;height:22px;z-index:2;border-style:dashed;border-color:rgba(0,0,0,.12);border-width:0}
.hem.t{top:0;border-bottom-width:2px}.hem.b{bottom:0;border-top-width:2px}
.content{position:absolute;inset:0;direction:rtl;display:flex;align-items:center;gap:34px;padding:0 56px}
.flag{width:250px;height:166px;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.txt{flex:1;font-family:T}
.t1{font-weight:700;font-size:104px;line-height:1.05;color:#111;white-space:nowrap}
.t2{font-weight:500;font-size:30px;color:#333;margin-top:14px;white-space:nowrap}
.eagle{width:150px;flex:none}
.stripe{position:absolute;left:0;right:0;height:16px}
/* Ösen */
.eye{position:absolute;z-index:4;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
 background:radial-gradient(circle,#6b6f74 0 7px,#d8dadd 8px 10px,#9da1a6 11px 13px,#eef0f2 14px);box-shadow:0 2px 3px rgba(0,0,0,.35)}
svg.ropes{position:absolute;inset:0;z-index:5}
</style></head><body><div class="scene">
<div class="bg"><i style="left:-80px;top:120px;width:420px;height:300px"></i><i style="left:260px;top:60px;width:380px;height:320px;background:#8aa57e"></i><i style="left:760px;top:90px;width:520px;height:330px;background:#738f6b"></i></div>
<div class="ground"></div>
<div class="fence"><div class="mesh"></div><div class="rail" style="top:6px"></div><div class="rail" style="bottom:6px"></div>
 <div class="post" style="left:60px"></div><div class="post" style="left:600px"></div><div class="post" style="left:1150px"></div></div>
<div class="banner">
 <div class="stripe" style="top:0;background:#007a3d"></div><div class="stripe" style="bottom:0;background:#111"></div>
 <div class="hem t"></div><div class="hem b"></div>
 <div class="content">
  <svg class="flag" viewBox="0 0 300 200"><rect width="300" height="67" fill="#007a3d"/><rect y="67" width="300" height="66" fill="#fff"/><rect y="133" width="300" height="67" fill="#111"/>
   <g fill="#ce1126" id="st"><path d="M90 82l7.6 21.8 23.1.4-18.4 14 6.7 22.1L90 127.1l-19 13.2 6.7-22.1-18.4-14 23.1-.4z"/></g><use href="#st" x="60"/><use href="#st" x="120"/>
   <rect width="300" height="200" fill="none" stroke="rgba(0,0,0,.15)"/></svg>
  <div class="txt"><div class="t1">سوريا حرة</div><div class="t2">الذكرى الثانية للتحرير – <span dir="ltr">8</span> كانون الأول</div></div>
  <img class="eagle" src="../../../public/shop/motifs/nisr-gold-dark.webp">
 </div>
</div>
<svg class="ropes" viewBox="0 0 1200 1200" id="ropes"></svg>
</div>
<script>
// Ösen + Seile zu den Zaunpfosten
const L=110,T=430,W=980,H=330, xs=[24,250,490,730,956], ys=[18,H-18];
const posts=[{x:71},{x:611},{x:1161}];
const svg=document.getElementById('ropes'); let html='';
for(const y of ys) for(const x of xs){
 const ex=L+x, ey=T+y; const d=document.createElement('div'); d.className='eye'; d.style.left=ex+'px'; d.style.top=ey+'px'; document.querySelector('.scene').appendChild(d);
 // Kabelbinder/Seil senkrecht zur nächsten Zaunstange
 const tx = ex + (x<100?-14: x>W-100?14:0); const ty = y<50 ? 344 : 936;
 html+=`<path d="M${ex} ${ey} L ${tx} ${ty}" stroke="#262626" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 html+=`<path d="M${ex+1} ${ey} L ${tx+1} ${ty}" stroke="rgba(255,255,255,.22)" stroke-width="1.5" fill="none"/>`;
 html+=`<rect x="${tx-7}" y="${ty-6}" width="14" height="12" rx="3" fill="#1d1d1d"/>`;
}
svg.innerHTML=html;
</script></body></html>
